# ADR 0002: regenerate generated vectors and fail if the tree changes.
# Also run the Rust, Zig, and Go verifier suites.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build jose-cli
        run: cargo build -p jose-cli

      - name: Regenerate vectors (fail if dirty)
        working-directory: ${{ github.workspace }}
        run: |
          rust/target/debug/jose-cli gen-vectors --out testvectors/generated
          git diff --exit-code -- testvectors/generated

      - name: Upload jose-cli
        uses: actions/upload-artifact@v4
        with:
          name: jose-cli
          path: rust/target/debug/jose-cli
          if-no-files-found: error

  zig:
    name: zig
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zig
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Test
        run: zig build test

  go:
    name: go
    runs-on: ubuntu-latest
    needs: rust
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: go/go.mod

      - name: Download jose-cli
        uses: actions/download-artifact@v4
        with:
          name: jose-cli
          path: ${{ runner.temp }}

      - name: Test (including differential vs jose-cli)
        env:
          AUTHCRAFT_JOSE_CLI: ${{ runner.temp }}/jose-cli
        run: |
          chmod +x "$AUTHCRAFT_JOSE_CLI"
          go test ./...

  fuzz:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz b64url (short)
        run: cargo +nightly fuzz run b64url_decode -- -max_total_time=15

      - name: Fuzz json (short)
        run: cargo +nightly fuzz run json_parse -- -max_total_time=15

      - name: Fuzz jose verify (short)
        run: cargo +nightly fuzz run jose_verify -- -max_total_time=15

      - name: Fuzz pkce (short)
        run: cargo +nightly fuzz run pkce_challenge -- -max_total_time=15
