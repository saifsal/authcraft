[package]
name = "oauth"
version = "0.1.0"
edition = "2021"
description = "OAuth 2.0 authorization-code + PKCE (S256) library for authcraft M1. Educational use only."
publish = false

[dependencies]
jose = { path = "../jose" }
ring = "0.17"
argon2 = "0.5"
webauthn-rs = { version = "0.6.2", default-features = false, features = ["danger-allow-state-serialisation"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
webauthn-authenticator-rs = { version = "0.6.2", default-features = false, features = ["softpasskey"] }
