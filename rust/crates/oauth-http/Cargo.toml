[package]
name = "oauth-http"
version = "0.1.0"
edition = "2021"
description = "Thin Axum HTTP binder for authcraft M1 OAuth (ADR 0005). Educational use only."
publish = false

[[bin]]
name = "oauth-http"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
oauth = { path = "../oauth" }
jose = { path = "../jose" }
axum = { version = "0.8", features = ["form"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webauthn-rs = { version = "0.6.2", default-features = false, features = ["danger-allow-state-serialisation"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Optional TLS / mTLS listener (ADR 0017). Already in the lockfile via reqwest.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
jose = { path = "../jose" }
webauthn-authenticator-rs = { version = "0.6.2", default-features = false, features = ["softpasskey"] }
